name: ci
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

# Gate exit-code contract, shared by every custody gate below:
#   0  verified
#   1  a real finding — fail the build
#   2  cannot verify (no chain key; CI has none) — skip
#
# The distinction is load-bearing. "Cannot verify" reported as a failure trains people to ignore
# the gate; reported as a pass, it launders an unchecked claim. Each gate reads its code in a
# TESTED context (`|| rc=$?`), because `cmd; rc=$?` under `bash -e` aborts the step first.
#
# No step is guarded by "does this artifact exist yet" any more. Those guards were scaffolding
# from M0 and they rotted into silent no-ops: the compat gate was skipped on every run for weeks
# because it tested for an empty directory git had never committed. A gate that cannot fail is
# worse than one that does, because it reports success.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Version strings agree
        run: |
          test -f VERSION
          python - <<'PY'
          import json, pathlib
          v = pathlib.Path("VERSION").read_text().strip()
          checks = {
              ".claude-plugin/marketplace.json": ["plugins", 0, "version"],
              ".claude-plugin/plugins/stop-guessing/.claude-plugin/plugin.json": ["version"],
              ".agents/plugins/marketplace.json": ["plugins", 0, "version"],
              ".agents/plugins/stop-guessing/.codex-plugin/plugin.json": ["version"],
          }
          for rel, path in checks.items():
              cur = json.loads(pathlib.Path(rel).read_text())
              for part in path:
                  cur = cur[part]
              assert cur == v, f"{rel} says {cur!r}, VERSION says {v!r}"
          print(f"VERSION={v}; {len(checks)} manifests agree")
          PY

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q -m ""

      - name: Bash suites
        run: |
          if compgen -G "tests/test_*.sh" > /dev/null; then
            for t in tests/test_*.sh; do bash "$t"; done
          else echo "no bash suites"; fi

      - name: Vendored no-noodles tree is unmodified
        run: python -m stop_guessing.cli.main manifest

      - name: no-noodles compatibility gate
        run: python -m stop_guessing.cli.main compat verify

      - name: Project page is not stale
        run: |
          rc=0
          python -m stop_guessing.cli.main page check || rc=$?
          if [ $rc -eq 1 ]; then exit 1; fi

      - name: AI-CAIQ evidence gate
        run: |
          rc=0
          python -m stop_guessing.cli.main caiq evidence || rc=$?
          if [ $rc -eq 1 ]; then exit 1; fi

      - name: Claims gate
        run: |
          # #38 (SG-HARD-005): this captured the exit code and echoed it, so a step named "gate"
          # could not fail — for unproven claims, malformed evidence, a key mismatch OR a crash.
          # The original reasoning was sound and is preserved below; what was missing is that it
          # collapsed "cannot verify here" and "verified and found a problem" into one silent pass,
          # so a genuine command failure looked exactly like the expected keyless run.
          #
          #   0 = verified, no findings          -> pass
          #   1 = verified, findings             -> FAIL
          #   2 = cannot verify (no chain key)   -> pass here, and say so loudly
          #   *  = the command itself broke      -> FAIL
          #
          # CI holds no chain key by design: the ledger is machine-local and deliberately not
          # committed, so the authoritative run is the one where the key lives (docs/REATTESTATION.md).
          # That makes 2 legitimate in this job and nowhere else — a protected release job must
          # run where the key is and must treat 2 as a failure.
          rc=0
          python -m stop_guessing.cli.main claims check || rc=$?
          case "$rc" in
            0) echo "claims check: verified, no findings" ;;
            2) echo "claims check: CANNOT VERIFY (no chain key in CI) — this job is not the gate."
               echo "              The authoritative run happens where the key lives." ;;
            1) echo "::error::claims check found unproven claims or unresolvable evidence"; exit 1 ;;
            *) echo "::error::claims check failed to run (exit $rc)"; exit "$rc" ;;
          esac
