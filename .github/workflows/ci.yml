name: ci
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Version strings agree
        run: |
          test -f VERSION
          echo "VERSION=$(cat VERSION)"
      - name: Install
        run: |
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; else echo "no package yet (M0)"; fi
      - name: Lint
        run: |
          if [ -f pyproject.toml ]; then ruff check .; else echo "no package yet (M0)"; fi
      - name: Unit tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet (M0)"; fi
      - name: Bash suites
        run: |
          if compgen -G "tests/test_*.sh" > /dev/null; then for t in tests/test_*.sh; do bash "$t"; done; else echo "no bash suites yet (M0)"; fi
      - name: no-noodles compatibility gate
        run: |
          if [ -d fixtures/payloads ]; then python -m stop_guessing.cli compat verify; else echo "no compat corpus yet (M0)"; fi
      - name: Project page is not stale
        run: |
          if [ -f pyproject.toml ] && [ -f docs/index.html ]; then
            python -m stop_guessing.cli.main page check; rc=$?
            # 0 = fresh, 1 = STALE (fail the build), 2 = no chain key (CI has none, so skip).
            # Exit 2 is a distinct code precisely so "cannot verify" never reads as "verified".
            if [ $rc -eq 1 ]; then exit 1; fi
          else echo "no page yet"; fi
      - name: AI-CAIQ evidence gate
        run: |
          if [ -f docs/ai-caiq/stop-guessing.yaml ]; then python -m stop_guessing.cli caiq evidence check; else echo "no AI-CAIQ answers yet (M8)"; fi
