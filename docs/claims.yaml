- id: CLAIM-09
  statement: The delegation sequence enforces test-before-live-data, and refuses a script whose digest
    changed after its test passed. NARROWED 2026-08-04 (SG-HARD-018/019). This holds against a cooperative
    script, not an adversarial one. The security subject is a mutable pathname, so a concurrent replacer
    can swap the bytes between the digest check and execution; and the paired test itself runs unsigned
    and can rewrite the script it has just certified. Immutable content-addressed execution is required
    before this is a security property rather than a discipline.
  surface:
  - cli:"stop-guessing delegate new"
