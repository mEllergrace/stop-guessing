# STOP-GUESSING — application claims
#
# `proofs:` is written ONLY by `stop-guessing prove`. Never edit it by hand: a record id
# a human could type proves only that a human typed. Each proof is a record id in this
# toolchain's own keyed ledger, and `stop-guessing claims check` re-verifies the chain
# covering it before counting it.
#
# See IMPLEMENTATION_PLAN.md §2.1 (definition of done) and §14 M10.

