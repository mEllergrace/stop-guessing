  statement: 'No statically detectable network call site exists in the shipped Python package except the
    named opt-in anchoring exception. This is a source audit, not a proof of no network activity. It cannot
    see indirect subprocess calls, shell network programs, dynamic imports or commands assembled at runtime.
    SUB-CLAIM WITHDRAWN 2026-08-04 (SG-HARD-039): this also asserted "and CI performs no fetch", which
    is false. CI runs actions/checkout, actions/setup-python and pip install, every one of which resolves
    a remote action or package. The proof equated the absence of literal curl and wget text with the absence
