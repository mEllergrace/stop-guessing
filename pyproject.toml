[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stop-guessing"
dynamic = ["version"]
description = "Chain of custody and data provenance for agentic AI. Aligned to CSA AICM v1.1.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Morning" }]
keywords = ["provenance", "chain-of-custody", "agentic-ai", "aicm", "in-toto", "audit"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
# The runtime genuinely needs YAML: the policy loader, the classification rules and the derived
# AI-CAIQ answers are all YAML. Declaring [] meant a packaged install crashed with
# ModuleNotFoundError on the first classified read (#17) — caught by the gap record the gate now
# writes (#23), which is the first time the two fixes exercised each other.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
caiq = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "ruff>=0.4", "openpyxl>=3.1", "PyYAML>=6"]

# Third-party conformance validators. Deliberately an EXTRA and never a runtime dependency: the
# offline guarantee (§2, decision 6) is about the runtime, and none of these is imported by any code
# path a hook executes. They exist so `scripts/benchmark_frameworks.py` can be re-run by someone who
# is not us — a benchmark only the author can run is not a benchmark.
#
#   case-utils           NIST-involved CASE/UCO SHACL validator (`case_validate`)
#   pyshacl, rdflib      what case-utils validates with
#   prov                 W3C PROV-JSON model, for round-trip validation
#   in-toto              the CNCF project; measured as exposing no Statement-v1 validator today
#   opentelemetry-proto  the generated OTLP protobuf JSON parser
conformance = [
    "case-utils>=0.17", "pyshacl>=0.29", "prov>=2.0", "in-toto>=3.0",
    "opentelemetry-proto>=1.30",
]

[project.scripts]
stop-guessing = "stop_guessing.cli.main:main"
coc-prov = "stop_guessing.cli.main:main"
coc = "stop_guessing.cli.main:main"

[project.urls]
Homepage = "https://mellergrace.github.io/stop-guessing/"
Source = "https://github.com/mEllergrace/stop-guessing"
Issues = "https://github.com/mEllergrace/stop-guessing/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["stop_guessing*"]

# #68 (SG-HARD-035). Without this a wheel shipped no policy set, no classification rules and no
# VERSION, and an editable install from the checkout hid it completely.
[tool.setuptools.package-data]
stop_guessing = [
    "data/VERSION", "data/policy/coc.policy.d/*.yaml", "data/rules/*.yaml",
    # The vendored no-noodles tree. Without these the wheel shipped no hooks, no risk rules and no
    # manifest, so `compat verify` had nothing to replay and `/no-noodle` had nothing to install —
    # the supersession promise (§10.1) was undeliverable from a wheel while passing from a checkout.
    "compat/nonoodles/*.sh", "compat/nonoodles/*.json", "compat/nonoodles/*.md",
    "compat/nonoodles/MANIFEST.sha256", "compat/nonoodles/UPSTREAM_VERSION",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: spawns many subprocesses (full corpus replay)"]
