[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stop-guessing"
dynamic = ["version"]
description = "Chain of custody and data provenance for agentic AI. Aligned to CSA AICM v1.1.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Morning" }]
keywords = ["provenance", "chain-of-custody", "agentic-ai", "aicm", "in-toto", "audit"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
# The runtime genuinely needs YAML: the policy loader, the classification rules and the derived
# AI-CAIQ answers are all YAML. Declaring [] meant a packaged install crashed with
# ModuleNotFoundError on the first classified read (#17) — caught by the gap record the gate now
# writes (#23), which is the first time the two fixes exercised each other.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
caiq = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "ruff>=0.4", "openpyxl>=3.1", "PyYAML>=6"]

[project.scripts]
stop-guessing = "stop_guessing.cli.main:main"
coc-prov = "stop_guessing.cli.main:main"
coc = "stop_guessing.cli.main:main"

[project.urls]
Homepage = "https://mellergrace.github.io/stop-guessing/"
Source = "https://github.com/mEllergrace/stop-guessing"
Issues = "https://github.com/mEllergrace/stop-guessing/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["stop_guessing*"]

# #68 (SG-HARD-035). Without this a wheel shipped no policy set, no classification rules and no
# VERSION, and an editable install from the checkout hid it completely.
[tool.setuptools.package-data]
stop_guessing = ["data/VERSION", "data/policy/coc.policy.d/*.yaml", "data/rules/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: spawns many subprocesses (full corpus replay)"]
