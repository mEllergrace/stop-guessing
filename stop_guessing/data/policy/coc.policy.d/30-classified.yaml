# Accumulation. The case no other tool handles: twelve innocuous reads, then one egress.
policies:
  - id: forbid-tainted-egress
    effect: forbid
    postures: [steer, bar]
    reason: >-
      This session holds classified taint and this call sends data outward. The same call earlier
      in the session would have been permitted; what changed is what the session now carries.
    when:
      call.is_egress: {is_true: true}
      session.taint_depth: {gte: 1}

  # Scoped to the ENFORCEMENT postures. Under `observe` this tool records and does not block —
  # the host's permission system has already decided, and a second gate refusing afterwards is a
  # recorder overriding its operator. The record still says the egress carried credential taint,
  # which is the evidence this exists to produce.
  - id: forbid-credential-egress
    effect: forbid
    postures: [steer, bar]
    # Out-ranks forbid-tainted-egress as the EXPLANATION. Both deny, and the outcome is identical
    # either way; but "credential material left the host" and "the session held some taint" are
    # very different findings to read back in an audit, and the record should carry the sharper
    # one. Priority never crosses effects — it only picks which forbid gets to explain itself.
    priority: 10
    reason: Credential material does not leave the host under an enforcement posture.
    when:
      call.is_egress: {is_true: true}
      session.taint: {contains: credential}

  - id: forbid-accumulation-threshold
    effect: forbid
    postures: [steer, bar]
    reason: >-
      This session has accumulated classified material from several distinct artifacts. Each read
      was individually unremarkable; together they are a dataset.
    when:
      session.taint_depth: {gte: 4}
      artifact.classified: {is_true: true}

  # The ONE refusal that survives `observe`, and it is not about the user's work: a recorder that
  # lets its own ledger be overwritten records nothing, so this protects the evidence rather than
  # policing the operator. Disable with {"protect_ledger": false} if even that is unwanted —
  # the option stays open, it just defaults to protecting the thing the tool exists to produce.
  - id: forbid-ledger-write
    effect: forbid
    reason: >-
      The evidence ledger is not writable through the agent under any posture. This protects the
      record, not the operator: a recorder whose ledger can be overwritten has recorded nothing.
    when:
      artifact.is_ledger: {is_true: true}
      call.is_write: {is_true: true}
      call.protect_ledger: {is_true: true}
